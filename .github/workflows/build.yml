name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, a64]
        configuration: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install ARM64 build tools
      if: matrix.platform == 'a64'
      run: |
        & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
          modify --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" `
          --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
          --quiet --norestart --wait
      shell: pwsh
      continue-on-error: true

    - name: Build
      run: msbuild tee.sln /p:Platform=${{ matrix.platform }} /p:Configuration=${{ matrix.configuration }} /m

    - name: Upload artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: tee-${{ matrix.platform }}
        path: bin/**/Release/tee.exe
        if-no-files-found: error
